<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chimeway - a team messaging workspace with channels, threads, and AI summaries." />
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chimeway</title>
    <script>
      /*
       * Apply the stored theme before first paint so there is no flash of the
       * wrong theme. Deliberately tiny and inline; the app takes over on mount.
       * Mirrors the logic in lib/theme.ts.
       */
      (function () {
        try {
          var stored = localStorage.getItem('chimeway:theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* Storage access can throw in private mode; fall back to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
