# Supabase project configuration.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "chimeway"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Caps any single PostgREST response, so a crafted request cannot ask for the
# entire message history in one call.
max_rows = 500

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Development default. Turn this on in production so addresses are verified
# before an account becomes usable.
enable_confirmations = false
max_frequency = "60s"

[auth.rate_limit]
# Blunt but effective against credential stuffing.
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "5MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true

[functions.ai]
# The function authenticates the caller itself and needs the raw Authorization
# header, so the gateway must not strip or pre-verify it.
verify_jwt = false
